name: Publish scores

# Runs when an AI (Claude routine, Claude Code on the web, Codex…) pushes scores to ANY branch.
# Copies the scores to main, so nobody has to merge anything, then updates the day's issue.
on:
  push:
    paths:
      - "data/scored/*.json"

permissions:
  contents: write
  issues: write

concurrency:
  group: job-agent-main
  cancel-in-progress: false

jobs:
  publish:
    # The template itself never runs; only your copy does
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect pushed score files
        id: collect
        run: |
          MAIN="${{ github.event.repository.default_branch }}"
          BEFORE="${{ github.event.before }}"
          if [ "${{ github.ref_name }}" = "$MAIN" ] && ! [[ "$BEFORE" =~ ^0+$ ]]; then
            RANGE="$BEFORE..${{ github.sha }}"
          else
            RANGE="origin/$MAIN...${{ github.sha }}"
          fi
          mkdir -p /tmp/scored
          # Only strict YYYY-MM-DD.json names: file names end up in shell commands below
          git diff --name-only --diff-filter=AM "$RANGE" -- 'data/scored/*.json' \
            | grep -E '^data/scored/[0-9]{4}-[0-9]{2}-[0-9]{2}\.json$' \
            | while read -r f; do cp "$f" /tmp/scored/; done || true
          echo "dates=$(ls /tmp/scored | sed 's/\.json$//' | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          echo "main=$MAIN" >> "$GITHUB_OUTPUT"

      - name: Switch to main
        if: steps.collect.outputs.dates != ''
        run: |
          git checkout "${{ steps.collect.outputs.main }}"
          git pull --ff-only

      - uses: actions/setup-python@v5
        if: steps.collect.outputs.dates != ''
        with:
          python-version: "3.12"
          cache: pip

      - name: Validate, copy to main, update issues
        if: steps.collect.outputs.dates != ''
        run: |
          pip install -r requirements.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp /tmp/scored/*.json data/scored/
          for DATE in ${{ steps.collect.outputs.dates }}; do
            python -m jobagent validate "$DATE"
          done
          git add data/scored
          git diff --cached --quiet || { git commit -m "Publish scores: ${{ steps.collect.outputs.dates }}" && git push; }
          for DATE in ${{ steps.collect.outputs.dates }}; do
            bash scripts/post_issue.sh "$DATE"
          done
